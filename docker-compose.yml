services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pythia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pythia}
      POSTGRES_DB: ${POSTGRES_DB:-pythia}
    volumes:
      - pythia-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pythia} -d $${POSTGRES_DB:-pythia}"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pythia}:${POSTGRES_PASSWORD:-pythia}@db:5432/${POSTGRES_DB:-pythia}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ORIGIN: ${PUBLIC_URL:-http://localhost:3000}
      UPLOADS_DIR: /app/uploads
      PORT: 3000
    volumes:
      - pythia-uploads:/app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  pythia-db:
  pythia-uploads:
